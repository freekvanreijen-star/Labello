window.LBSync = (function () {
  var ok = false, db = null, authP = null;
  var configured = LB_FIREBASE.apiKey.indexOf("PASTE") !== 0;

  if (configured) {
    try {
      firebase.initializeApp(LB_FIREBASE);
      db = firebase.database();
      authP = firebase.auth().signInAnonymously().catch(function (e) {
        console.warn("[lb] anonymous auth failed:", e && e.code);
      });
      ok = true;
    } catch (e) {
      console.warn("[lb] firebase unavailable:", e);
    }
  }

  /* Firebase turns arrays into objects with numeric keys, and drops empty
     ones entirely. Everything read back out of the DB goes through this. */
  function toArr(v) {
    if (Array.isArray(v)) return v;
    if (!v || typeof v !== "object") return [];
    return Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
  }
  function norm(s) {
    if (!s) return null;
    s.players = toArr(s.players);
    s.pairs   = toArr(s.pairs).map(function (p) { return toArr(p); });
    s.order   = toArr(s.order);
    s.casts   = toArr(s.casts).map(function (c) { return toArr(c); });
    s.rules   = toArr(s.rules);
    s.skips   = toArr(s.skips);
    return s;
  }

  var stateRef = function (c) { return db.ref("rooms/" + c + "/state"); };

  return {
    available: function () { return ok; },
    ready: function () { return authP || Promise.resolve(); },
    norm: norm,

    create: function (code, state) {
      return (authP || Promise.resolve()).catch(function () {})
        .then(function () { return stateRef(code).set(state); })
        .then(function () { return true; })
        .catch(function (e) { console.warn("[lb] create failed:", e); return false; });
    },

    get: function (code) {
      return stateRef(code).once("value").then(function (s) { return norm(s.val()); })
        .catch(function () { return null; });
    },

    write: function (code, state) {
      /* Wait for the anonymous session before writing. The rules require
         auth, so a write that raced sign-in would be rejected outright. */
      return (authP || Promise.resolve()).catch(function () {})
        .then(function () { return stateRef(code).set(state); })
        .catch(function (e) { console.warn("[lb] write failed:", e); });
    },

    /* Atomic join. Firebase retries this against fresh data on conflict, so
       two phones tapping Join at the same instant cannot clobber each other
       -- which is what a plain read-modify-write would do. */
    join: function (code, player) {
      return (authP || Promise.resolve()).catch(function () {})
        .then(function () {
          return stateRef(code).transaction(function (cur) {
            if (cur === null) return cur;                // no such room
            var s = norm(cur);
            if (s.phase !== "lobby") return;             // abort: already started
            if (s.players.length >= 16) return;          // abort: full
            var dup = s.players.filter(function (p) { return p.id === player.id; }).length;
            if (!dup) {
              player.c = s.players.length % 8;
              s.players.push(player);
            }
            s.ts = Date.now();
            return s;
          });
        }).then(function (r) {
          if (!r.committed) return { ok: false, room: norm(r.snapshot && r.snapshot.val()) };
          return { ok: true, room: norm(r.snapshot.val()) };
        }).catch(function (e) {
          console.warn("[lb] join failed:", e);
          return { ok: false, room: null, err: e };
        });
    },

    /* Read-modify-write of the live state, retried against fresh data on
       conflict. Advancing a card goes through this so that four people
       tapping Next at once still only moves the game on by one. */
    tx: function (code, mutate) {
      return (authP || Promise.resolve()).catch(function () {})
        .then(function () {
          return stateRef(code).transaction(function (cur) {
            if (cur === null) return cur;
            return mutate(norm(cur));
          });
        })
        .catch(function (e) { console.warn("[lb] tx failed:", e); });
    },

    subscribe: function (code, cb) {
      var r = stateRef(code);
      var h = r.on("value", function (s) { cb(norm(s.val())); });
      return function () { r.off("value", h); };
    },

    /* Presence lives outside /state so that rewriting the game state on
       every card does not wipe it. */
    presence: function (code, id, name) {
      var p = db.ref("rooms/" + code + "/presence/" + id);
      p.onDisconnect().remove();
      p.set({ name: name, t: firebase.database.ServerValue.TIMESTAMP });
      return function () { try { p.remove(); } catch (e) {} };
    },

    watchPresence: function (code, cb) {
      var r = db.ref("rooms/" + code + "/presence");
      var h = r.on("value", function (s) { cb(s.val() || {}); });
      return function () { r.off("value", h); };
    }
  };
})();

/* ================================================================== *
 *  LOOK & FEEL                                                        *
 *  Warm blush paper, candy stickers, chunky pressable everything.     *
 *  Heat is communicated by COLOUR: the card face runs mint -> sky ->  *
 *  gold -> coral -> violet as the night escalates, so you can feel    *
 *  the game heating up without reading a number.                      *
 * ================================================================== */
const CSS = `
.lb *, .lb *::before, .lb *::after { box-sizing: border-box; }
.lb {
  --paper:#FFF0E9; --paper2:#FFF8F4; --panel:#FFFFFF; --panel2:#FFF4EE;
  --line:#F6D9CB; --edge:#EFA98C; --edgeDeep:#D98A6B;
  --ink:#3A2430; --dim:#7A5F6C; --faint:#B79AA6;
  --pink:#FF3D71; --pinkDark:#D81E56; --pinkSoft:#FFD9E4;
  --violet:#7C4DFF; --violetDark:#5B2FD6; --violetSoft:#E6DCFF;
  --gold:#FFB020; --goldDark:#DB8C00;
  --mint:#00C2A8; --mintDark:#009683;
  --sky:#3FA9F5; --skyDark:#2683C9;
  --disp:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(115% 70% at 50% -10%, #FFD6E4 0%, rgba(255,240,233,0) 60%),
    radial-gradient(80% 50% at 105% 100%, #E3D8FF 0%, rgba(255,240,233,0) 55%),
    radial-gradient(70% 45% at -8% 78%, #FFE7C4 0%, rgba(255,240,233,0) 55%),
    var(--paper);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  min-height: 100vh; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
.lb-wrap { max-width: 560px; margin:0 auto; padding: 20px 16px calc(40px + env(safe-area-inset-bottom)); }
.lb h1,.lb h2,.lb h3 { margin:0; font-family:var(--disp); font-weight:600; line-height:1.08; }
.lb p { margin:0; }

/* ---- logo ---- */
.lb-logo { font-family:var(--disp); font-weight:600; font-size:clamp(52px,17vw,92px);
  line-height:.92; color:var(--pink); text-shadow:3px 3px 0 #FFC2D5, 6px 6px 0 rgba(216,30,86,.16);
  letter-spacing:-.02em; }
.lb-logo em { font-style:normal; color:var(--violet); text-shadow:3px 3px 0 #D9C9FF; }
.lb-kicker { font-weight:900; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--violetDark); }
.lb-sub { color:var(--dim); font-size:15px; font-weight:700; line-height:1.55; }
.lb-center { text-align:center; }

/* ---- surfaces ---- */
.lb-card { background:var(--panel); border:3px solid var(--edge); border-radius:24px;
  padding:16px; box-shadow:0 5px 0 #F2C3AB; }
.lb-card + .lb-card { margin-top:14px; }
.lb-card h3 { font-size:20px; }
.lb-hair { height:3px; background:var(--line); border-radius:3px; margin:12px 0; border:0; }

/* ---- buttons ---- */
.lb-btn { width:100%; border:3px solid var(--pinkDark); border-radius:18px; padding:14px 16px;
  font-family:var(--disp); font-weight:600; font-size:20px; background:var(--pink); color:#fff;
  cursor:pointer; -webkit-tap-highlight-color:transparent; box-shadow:0 5px 0 var(--pinkDark);
  transition:transform .08s ease, box-shadow .08s ease; }
.lb-btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--pinkDark); }
.lb-btn:disabled { opacity:.4; cursor:default; transform:none; }
.lb-btn.violet { background:var(--violet); border-color:var(--violetDark); box-shadow:0 5px 0 var(--violetDark); }
.lb-btn.violet:active { box-shadow:0 1px 0 var(--violetDark); }
.lb-btn.gold { background:var(--gold); border-color:var(--goldDark); box-shadow:0 5px 0 var(--goldDark); color:#4A2E00; }
.lb-btn.gold:active { box-shadow:0 1px 0 var(--goldDark); }
.lb-btn.mint { background:var(--mint); border-color:var(--mintDark); box-shadow:0 5px 0 var(--mintDark); color:#04322C; }
.lb-btn.mint:active { box-shadow:0 1px 0 var(--mintDark); }
.lb-btn.ghost { background:var(--panel); border-color:var(--edge); box-shadow:0 5px 0 #F2C3AB; color:var(--dim); }
.lb-btn.ghost:active { box-shadow:0 1px 0 #F2C3AB; }
.lb-btn.sm { padding:9px 13px; font-size:15px; border-radius:14px; width:auto; border-width:2px;
  box-shadow:0 3px 0 var(--pinkDark); }
.lb-btn.sm:active { transform:translateY(2px); box-shadow:0 1px 0 var(--pinkDark); }
.lb-btn.ghost.sm { box-shadow:0 3px 0 #F2C3AB; }
.lb-btn.violet.sm { box-shadow:0 3px 0 var(--violetDark); }
.lb-btn.gold.sm { box-shadow:0 3px 0 var(--goldDark); }
.lb-btn.mint.sm { box-shadow:0 3px 0 var(--mintDark); }
.lb-row { display:flex; gap:9px; }
/* Deliberately a quiet link rather than a third button: at level 5 the Pass
   label carries a subline, and a third button in that row wrapped it. */
.lb-back { display:block; margin:14px auto 0; padding:6px 10px; background:none; border:0;
  cursor:pointer; -webkit-tap-highlight-color:transparent; font-family:var(--body);
  font-weight:800; font-size:13px; color:var(--violetDark); text-decoration:underline;
  text-underline-offset:3px; text-decoration-thickness:2px; }
.lb-back:active { opacity:.55; }
.lb-back:focus-visible { outline:3px solid var(--violet); outline-offset:3px; border-radius:8px; }
.lb-row > * { flex:1; }
.lb-row.auto > * { flex:0 0 auto; }

/* ---- home: big stacked choices ---- */
.lb-big { width:100%; text-align:left; border:3px solid var(--pinkDark); border-radius:22px;
  padding:16px 18px; background:var(--pink); color:#fff; cursor:pointer; display:block;
  -webkit-tap-highlight-color:transparent; box-shadow:0 6px 0 var(--pinkDark);
  transition:transform .08s ease, box-shadow .08s ease; }
.lb-big:active { transform:translateY(5px); box-shadow:0 1px 0 var(--pinkDark); }
.lb-big:disabled { opacity:.5; }
.lb-big .t { display:block; font-family:var(--disp); font-weight:600; font-size:25px; line-height:1.15; }
.lb-big .d { display:block; font-size:13.5px; font-weight:700; margin-top:3px; opacity:.93; line-height:1.42; }
.lb-big.violet { background:var(--violet); border-color:var(--violetDark); box-shadow:0 6px 0 var(--violetDark); }
.lb-big.violet:active { box-shadow:0 1px 0 var(--violetDark); }
.lb-big.gold { background:var(--gold); border-color:var(--goldDark); box-shadow:0 6px 0 var(--goldDark); color:#4A2E00; }
.lb-big.gold:active { box-shadow:0 1px 0 var(--goldDark); }
.lb-big + .lb-big { margin-top:12px; }

/* ---- inputs ---- */
.lb-input { width:100%; background:var(--paper2); border:3px solid var(--edge); border-radius:16px;
  padding:13px 14px; color:var(--ink); font-size:16px; font-family:var(--body); font-weight:700; outline:none; }
.lb-input::placeholder { color:#CBB0A2; }
.lb-input:focus-visible, .lb-btn:focus-visible, .lb-big:focus-visible, .lb-chip:focus-visible {
  outline:3px solid var(--violet); outline-offset:3px; }
.lb-code-in { text-transform:uppercase; letter-spacing:.32em; text-align:center;
  font-family:var(--disp); font-size:30px; font-weight:600; padding:12px; }

/* ---- player chips ---- */
.lb-chips { display:flex; flex-wrap:wrap; gap:8px; }
.lb-chip { display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:7px 12px 7px 8px;
  font-weight:800; font-size:14.5px; border:3px solid; cursor:pointer; background:var(--panel);
  -webkit-tap-highlight-color:transparent; transition:transform .08s ease; font-family:var(--body); }
.lb-chip:active { transform:scale(.95); }
.lb-chip .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  font-size:12px; font-weight:900; color:#fff; flex:none; }
.lb-chip .x { font-size:16px; opacity:.5; line-height:1; }
.lb-chip.sel { transform:scale(1.04); box-shadow:0 0 0 4px var(--violetSoft); }
.lb-chip.paired { background:var(--pinkSoft); }
.lb-chip .heart { font-size:13px; }

/* player palette */
.c0{--pc:#FF3D71}.c1{--pc:#7C4DFF}.c2{--pc:#00C2A8}.c3{--pc:#FFB020}
.c4{--pc:#3FA9F5}.c5{--pc:#FF7043}.c6{--pc:#EC4899}.c7{--pc:#22C55E}
.lb-chip{border-color:var(--pc);color:var(--pc)} .lb-chip .dot{background:var(--pc)}

/* ---- pair rows ---- */
.lb-pair { display:flex; align-items:center; gap:8px; background:var(--pinkSoft);
  border:3px solid #FFB3C9; border-radius:16px; padding:8px 10px; font-weight:800; font-size:14.5px; }
.lb-pair + .lb-pair { margin-top:8px; }
.lb-pair .who { flex:1; color:var(--pinkDark); }
.lb-pair button { border:0; background:transparent; font-size:18px; cursor:pointer; opacity:.55; padding:2px 4px; }

/* ---- segmented control ---- */

/* ================================================================== *
 *  ENGINE                                                             *
 * ================================================================== */

const TYPES = {
  nhie:  { e:"\u{1F645}", label:"Never have I ever" },
  truth: { e:"\u{1F4AC}", label:"Truth" },
  dare:  { e:"\u{1F3AF}", label:"Dare" },
  phys:  { e:"\u{1F48B}", label:"Contact" },
  drink: { e:"\u{1F37B}", label:"Drink" },
  vote:  { e:"\u{1F449}", label:"Vote" },
  rule:  { e:"\u{1F4DC}", label:"New rule" },
  game:  { e:"\u{1F3B2}", label:"Mini game" },
  group: { e:"\u{1F46F}", label:"Everyone" }
};
const HEATS = ["", "Warm up", "Loosening up", "Spicy", "Hot", "Filthy"];
const HEAT_BLURB = ["",
  "Icebreakers and easy sips.",
  "Bolder questions, friendly contact.",
  "Flirty. First kisses between matches.",
  "Kissing, clothing, real confessions.",
  "Nudity, spanking, licking, blunt ratings. A pass costs you a chug."];

/* Above this level a pass stops being free. The card still gets skipped, but
   it costs a drink, so nobody is ever actually made to do anything. */
const HARD_HEAT = 5;
const LENGTHS = [
  { k:"short",  n:25, label:"Short",    d:"~20 min" },
  { k:"normal", n:40, label:"Normal",   d:"~35 min" },
  { k:"long",   n:60, label:"Long",     d:"~1 hour" },
  { k:"epic",   n:90, label:"Marathon", d:"all night" }
];

/* Which placeholders a card actually uses, in canonical order. The cast
   array written to the DB lines up with this, so it must stay stable. */
const SLOT_ORDER = ["p", "q", "r", "m", "n"];
function slotsOf(text) {
  return SLOT_ORDER.filter(function (s) { return text.indexOf("{" + s + "}") >= 0; });
}

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];

/* How many cards of each heat, for a game of `len` cards capped at `maxHeat`.
   Slightly front-loaded: the warm-up matters, the filthy end should feel
   earned and short rather than a long plateau. */
function heatPlan(len, maxHeat) {
  const base = [22, 22, 21, 19, 16].slice(0, maxHeat);
  const sum = base.reduce((a, b) => a + b, 0);
  const counts = base.map((w) => Math.max(1, Math.round((w / sum) * len)));
  let drift = counts.reduce((a, b) => a + b, 0) - len;
  /* Reconcile rounding against the *hottest* levels first, so shortening a
     game trims the tail rather than the warm-up. */
  for (let g = 0; drift !== 0 && g < 500; g++) {
    const i = drift > 0 ? counts.length - 1 - (g % counts.length)
                        : (g % counts.length);
    if (drift > 0 && counts[i] > 1) { counts[i]--; drift--; }
    else if (drift < 0) { counts[i]++; drift++; }
  }
  const plan = [];
  counts.forEach((c, i) => { for (let k = 0; k < c; k++) plan.push(i + 1); });
  return plan;
}

/* Can this card be cast with the roster we have? */
function castable(card, nPlayers, nPairs) {
  const s = slotsOf(card[2]);
  if (s.indexOf("m") >= 0 && nPairs < 1) return false;
  if (s.indexOf("r") >= 0 && nPlayers < 3) return false;
  if (s.indexOf("q") >= 0 && nPlayers < 2) return false;
  return nPlayers >= 1;
}

/* How many cards this exact roster + cap can actually draw from. Used to warn
   the host when they ask for a longer game than the settings can fill. */
function poolSize(players, pairs, maxHeat) {
  return DECK.filter((c) => c[1] <= maxHeat && castable(c, players.length, pairs.length)).length;
}

/* Fill a card's slots with actual player ids. {m}/{n} always resolve to a
   real matched pair -- that is the whole consent mechanism, so it must never
   silently fall back to random players. */
function castFor(card, players, pairs) {
  const s = slotsOf(card[2]);
  const out = [];
  if (s.indexOf("m") >= 0) {
    const pr = pick(pairs);
    const flip = Math.random() < 0.5;
    s.forEach(function (slot) {
      if (slot === "m") out.push(flip ? pr[0] : pr[1]);
      else if (slot === "n") out.push(flip ? pr[1] : pr[0]);
    });
    return out;
  }
  const pool = shuffle(players.map((p) => p.id));
  s.forEach(function (_, i) { out.push(pool[i]); });
  return out;
}

/* Pre-roll the whole game up front. Every phone then reads the same order
   out of the database, so nothing has to agree on randomness at play time. */
function buildGame(players, pairs, len, maxHeat) {
  const plan = heatPlan(len, maxHeat);
  const nP = players.length, nPr = pairs.length;

  /* Bucket playable card indices by heat once. */
  const byHeat = {};
  DECK.forEach(function (c, i) {
    if (c[1] > maxHeat) return;
    if (!castable(c, nP, nPr)) return;
    (byHeat[c[1]] = byHeat[c[1]] || []).push(i);
  });
  Object.keys(byHeat).forEach(function (h) { byHeat[h] = shuffle(byHeat[h]); });

  const used = {}, order = [], casts = [], recent = [];
  function take(h) {
    const bucket = byHeat[h];
    if (!bucket || !bucket.length) return -1;
    /* Prefer a type we have not just played, so the deck does not serve
       four Never Have I Evers in a row. */
    let idx = bucket.findIndex(function (ci) {
      return !used[ci] && recent.indexOf(DECK[ci][0]) < 0;
    });
    if (idx < 0) idx = bucket.findIndex(function (ci) { return !used[ci]; });
    if (idx < 0) return -1;
    const ci = bucket[idx];
    bucket.splice(idx, 1);
    used[ci] = 1;
    return ci;
  }

  plan.forEach(function (h) {
    let ci = take(h);
    /* Ran that heat dry: borrow from the nearest heat we still have, staying
       under the cap. Widen outwards rather than jumping straight to hottest. */
    for (let d = 1; ci < 0 && d <= 4; d++) {
      if (h - d >= 1) ci = take(h - d);
      if (ci < 0 && h + d <= maxHeat) ci = take(h + d);
    }
    if (ci < 0) return;
    order.push(ci);
    casts.push(castFor(DECK[ci], players, pairs));
    recent.push(DECK[ci][0]);
    if (recent.length > 2) recent.shift();
  });

  return { order: order, casts: casts };
}

/* Rules are derived, never stored: a rule card at position j with duration d
   is live for cards j+1 .. j+d. That keeps the synced state small and means
   rewinding or replaying can never leave a stale rule hanging around. */
function activeRules(order, i) {
  const out = [];
  for (let j = Math.max(0, i - 12); j < i; j++) {
    const c = DECK[order[j]];
    if (!c || c[0] !== "rule") continue;
    const left = (j + c[3]) - i + 1;
    if (left > 0) out.push({ text: c[2], left: left });
  }
  return out;
}

const nameOf = (players, id) => {
  const p = players.filter((x) => x.id === id)[0];
  return p ? p.name : "someone";
};

/* Render card text with the cast spliced in, names in white pills. */
function renderText(card, cast, players) {
  const slots = slotsOf(card[2]);
  const map = {};
  slots.forEach(function (s, i) { map[s] = cast[i]; });
  const parts = card[2].split(/(\{[pqrmn]\})/g);
  return parts.map(function (part, k) {
    const m = /^\{([pqrmn])\}$/.exec(part);
    if (!m) return part;
    return <b className="nm" key={k}>{nameOf(players, map[m[1]])}</b>;
  });
}

/* Everyone the current card is pointed at -- used to highlight chips. */
function targetsOf(card, cast) { return cast || []; }

const CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ";   /* no I or O */
const newCode = () => Array.from({ length: 4 },
  () => CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)]).join("");
const newId = () => Math.random().toString(36).slice(2, 10);

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const pairOf = (pairs, id) => {
  for (const pr of pairs) {
    if (pr[0] === id) return pr[1];
    if (pr[1] === id) return pr[0];
  }
  return null;
};

function Chip({ p, onClick, selected, partner, dim }) {

    <button type="button"

/* Tap one player, tap another, they are matched. Tap a matched player to
   break the pair. Everything past a hug is dealt only to these couples. */
function Matchmaker({ players, pairs, setPairs, disabled }) {
  const [sel, setSel] = useState(null);

  function tap(id) {
    if (disabled) return;
    const existing = pairOf(pairs, id);
    if (existing) {
      setPairs(pairs.filter((pr) => pr.indexOf(id) < 0));
      setSel(null);
      return;
    }
    if (sel === null) { setSel(id); return; }
    if (sel === id) { setSel(null); return; }
    setPairs(pairs.concat([[sel, id]]));
    setSel(null);
  }

  return (
    <div>
      <div className="lb-label">
        Matches
        <span className="lb-badgecount">{pairs.length}</span>
      </div>
      <p className="lb-note" style={{ marginBottom: 10 }}>
        Tap two people to match them. Kissing, clothing and anything past a hug
        is dealt <b>only to matched couples</b>. Hugs and friendly dares can hit
        anyone.
      </p>
      <div className="lb-chips">
        {players.map((p) => (
          <Chip key={p.id} p={p} selected={sel === p.id}
            partner={!!pairOf(pairs, p.id)} onClick={() => tap(p.id)} />
        ))}
      </div>
      {sel !== null && (
        <p className="lb-note" style={{ marginTop: 10, color: "var(--violetDark)", fontWeight: 900 }}>
          Now tap who {nameOf(players, sel)} is matched with.
        </p>
      )}
      {pairs.length > 0 && (
        <div style={{ marginTop: 12 }}>
          {pairs.map((pr, i) => (
            <div className="lb-pair" key={i}>
              <span>&#128139;</span>
              <span className="who">{nameOf(players, pr[0])} &nbsp;+&nbsp; {nameOf(players, pr[1])}</span>
              {!disabled && <button onClick={() => setPairs(pairs.filter((_, k) => k !== i))}>&#10005;</button>}
            </div>
          ))}
        </div>
      )}
      {pairs.length === 0 && (
        <div className="lb-warn" style={{ marginTop: 12 }}>
          No matches yet. That is fine. The game just skips every kissing
          and clothing card and stays at hugs and dares.
        </div>
      )}
    </div>
  );
}

function Settings({ cfg, setCfg, pairs, players }) {
  const pool = poolSize(players, pairs, cfg.maxHeat);
  const short = pool < cfg.len;
  return (
    <div>
      <div className="lb-label">Length</div>
      <div className="lb-seg">
        {LENGTHS.map((L) => (
          <button key={L.k} className={cfg.len === L.n ? "on" : ""}
            onClick={() => setCfg({ ...cfg, len: L.n })}>
            {L.label}<br /><small style={{ fontSize: 11, opacity: .75 }}>{L.d}</small>
          </button>
        ))}
      </div>

      <div className="lb-label" style={{ marginTop: 18 }}>How far it goes</div>
      <div className="lb-seg heat">
        {[1, 2, 3, 4, 5].map((h) => (
          <button key={h} className={cfg.maxHeat === h ? "on" : ""}
            onClick={() => setCfg({ ...cfg, maxHeat: h })}>{h}</button>
        ))}
      </div>
      <p className="lb-note" style={{ marginTop: 8 }}>
        <b style={{ color: "var(--pinkDark)" }}>{HEATS[cfg.maxHeat]}</b>: {HEAT_BLURB[cfg.maxHeat]}
        {cfg.maxHeat >= 3 && pairs.length === 0 &&
          <span> With no matches set, those cards are left in the box.</span>}
      </p>
      {short && (
        <div className="lb-warn" style={{ marginTop: 12 }}>
          Only <b>{pool}</b> cards fit these settings, so the game will end there
          instead of at {cfg.len}. Raise the level or pick a shorter game.
        </div>
      )}
    </div>
  );
}

function Lobby({ st, setSt, solo, code, meId, isHost, presence, onStart, onLeave }) {
  const [nm, setNm] = useState("");
  const players = st.players, pairs = st.pairs, cfg = st.cfg;
  const qrRef = useRef(null);

  const joinUrl = code
    ? location.origin + location.pathname + "#" + code
    : null;
  const enough = players.length >= 2;
  const canEdit = solo || isHost;

  useEffect(() => {
    if (!joinUrl || !qrRef.current || typeof qrcode !== "function") return;
    try {
      const q = qrcode(0, "M");
      q.addData(joinUrl);
      q.make();
      qrRef.current.innerHTML = q.createImgTag(5, 8);
    } catch (e) { /* QR is a nicety; the code still works */ }
  }, [joinUrl]);

  function addPlayer() {
    const n = nm.trim().slice(0, 14);
    if (!n || players.length >= 16) return;
    setSt({ ...st, players: players.concat([{ id: newId(), name: n, c: players.length % 8 }]) });
    setNm("");
  }
  function removePlayer(id) {
    setSt({
      ...st,
      players: players.filter((p) => p.id !== id),
      pairs: pairs.filter((pr) => pr.indexOf(id) < 0)
    });
  }


  return (
    <div>
      <Logo small />

      {code && (
        <div className="lb-card">
          <div className="lb-codebox">
            <div className="lb-kicker">Room code</div>
            <div className="code">{code}</div>
          </div>
          <div className="lb-qr" ref={qrRef} />
          <p className="lb-note lb-center">
            Scan, or send them <b>{joinUrl}</b>
          </p>
        </div>
      )}

      <div className="lb-card">
        <h3>Who is playing{players.length ? " " : ""}
          <span className="lb-badgecount">{players.length}</span></h3>
        <hr className="lb-hair" />

        {solo && (
          <div className="lb-row" style={{ marginBottom: 12 }}>
            <input className="lb-input" placeholder="Name" value={nm} maxLength={14}
              onChange={(e) => setNm(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addPlayer()} />
            <button className="lb-btn sm" style={{ flex: "0 0 auto" }}
              onClick={addPlayer} disabled={!nm.trim()}>Add</button>
          </div>
        )}

        {players.length === 0 && <div className="lb-empty">
          {solo ? "Add everyone in the room." : "Waiting for people to join…"}
        </div>}

        <div className="lb-chips">
          {players.map((p) => (
            <Chip key={p.id} p={p}
              /* Only whoever is doing the matching sees who is matched. A
                 guest must not be able to read the pairings off the roster,
                 not even their own. */
              partner={canEdit && !!pairOf(pairs, p.id)}
              dim={!!code && !presence[p.id] && p.id !== meId}
              onClick={() => solo && removePlayer(p.id)} />
          ))}
        </div>
        {solo && players.length > 0 &&
          <p className="lb-note" style={{ marginTop: 10 }}>Tap a name to remove them.</p>}
        {code && <p className="lb-note" style={{ marginTop: 10 }}>Faded names are phones that dropped off.</p>}
      </div>

      {canEdit ? (
        <>
          <div className="lb-card">
            <Matchmaker players={players} pairs={pairs}
              setPairs={(pr) => setSt({ ...st, pairs: pr })} />
          </div>

          <div className="lb-card">
            <Settings cfg={cfg} setCfg={(c) => setSt({ ...st, cfg: c })}
              pairs={pairs} players={players} />
          </div>

          <div style={{ marginTop: 16 }}>
            <button className="lb-btn violet" onClick={onStart} disabled={!enough}>
              {enough ? "Start the night →" : "Need at least 2 players"}
            </button>
          </div>
        </>
      ) : (
        <div className="lb-card lb-dead">
          <div className="lb-blob">&#127864;</div>
          <h3 style={{ marginTop: 10 }}>You are in.</h3>
          <p className="lb-note" style={{ marginTop: 8 }}>
            Waiting for {nameOf(players, st.host)} to start the night.
          </p>
        </div>
      )}

      <div style={{ marginTop: 12 }}>
        <button className="lb-btn ghost" onClick={onLeave}>
          {solo ? "Back" : "Leave room"}
        </button>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  PLAY                                                               *
 * ================================================================== */

function Play({ st, meId, onNext, onPass, onBack, onQuit }) {
  const i = st.i;
  const card = DECK[st.order[i]];
  const cast = st.casts[i] || [];
  if (!card) return null;

  const heat = card[1];
  const meta = TYPES[card[0]];
  const rules = activeRules(st.order, i);
  const onMe = meId && cast.indexOf(meId) >= 0;
  const hardPass = heat >= HARD_HEAT;

  return (
    <div>
      <div className="lb-hud" style={{ marginBottom: 6 }}>
        <button className="lb-btn ghost sm" style={{ flex: "0 0 auto", padding: "7px 11px" }}
          onClick={onQuit}>&#10005;</button>
        <div className="lb-meter">
          {[1, 2, 3, 4, 5].map((k) => (
            <i key={k} className={k <= heat ? "on" + k : ""} />
          ))}
        </div>
        <div className="lb-count">{i + 1}/{st.order.length}</div>
      </div>
      {rules.length > 0 && (
        <div className="lb-rules">
          {rules.map((r, k) => (
            <div className="r" key={k}>
              <span className="n">{r.left}</span>
              <span>&#128220; {r.text}</span>
            </div>
          ))}
        </div>
      )}

      <div className="lb-stage">
        <div className={"lb-face h" + heat} onClick={onNext} key={i}>
          <span className="badge">
            <span className="e">{meta.e}</span>{meta.label}
          </span>
          <div className="txt">
            <span>{renderText(card, cast, st.players)}</span>
          </div>
          <div className="foot">
            <span>{onMe ? "\u{1F449} that is you" : ""}</span>
            <span className="tap">tap for next &#8594;</span>
          </div>
        </div>
      </div>

      <div className="lb-row">
        <button className={"lb-btn " + (hardPass ? "gold" : "ghost")} onClick={onPass}>
          {hardPass
            ? <>Pass<br /><small style={{ fontSize: 12, opacity: .75 }}>costs a chug</small></>
            : "Pass"}
        </button>
        <button className="lb-btn" style={{ flex: 2 }} onClick={onNext}>Next &#8594;</button>
      </div>
      <p className="lb-note lb-center" style={{ marginTop: 10 }}>
        {hardPass
          ? "A pass costs you now. Down your drink, or take 3 shots."
          : "Passing costs nothing. Take a sip if you feel like it."}
      </p>
      {i > 0 && (
        <button className="lb-back" onClick={onBack}>&#8592; Missed the last one?</button>
      )}
    </div>
  );
}

/* ================================================================== *
 *  THE END                                                            *
 * ================================================================== */

function End({ st, onAgain, onHome, canRestart }) {
  const played = st.order.length;
  const skipped = (st.skips || []).length;
  return (
    <div>
      <div style={{ height: 20 }} />
      <div className="lb-center">
        <div className="lb-blob">&#128139;</div>
        <h1 style={{ fontSize: 44, color: "var(--pink)", marginTop: 8 }}>That is a wrap</h1>
        <p className="lb-sub" style={{ marginTop: 10 }}>
          {skipped === 0
            ? "Not a single pass. Reckless. Respect."
            : skipped === 1 ? "One pass all night. Nearly flawless."
            : "" + skipped + " cards passed. Cowards, all of you."}
        </p>
      </div>

      <div className="lb-card" style={{ marginTop: 20 }}>
        <h3>Tonight</h3>
        <hr className="lb-hair" />
        <p className="lb-note">
          <b>{played}</b> cards played, peaking at <b>{HEATS[st.cfg.maxHeat]}</b>.<br />
          <b>{st.players.length}</b> players, <b>{st.pairs.length}</b> matched
          {st.pairs.length ? ": " + st.pairs.map((pr) =>
            nameOf(st.players, pr[0]) + " + " + nameOf(st.players, pr[1])).join(", ") : ""}.<br />
          There are <b>{DECK.length - played}</b> cards you have not seen yet.
        </p>
      </div>

      {canRestart && (
        <div style={{ marginTop: 16 }}>
          <button className="lb-btn violet" onClick={onAgain}>Another round &#8594;</button>
        </div>
      )}
      <div style={{ marginTop: 10 }}>
        <button className="lb-btn ghost" onClick={onHome}>Back to the start</button>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  ENTRY SCREENS                                                      *
 * ================================================================== */

/* Deliberately bare, at Sam's request: the logo and the one button. The button
   label is now the only place the app states what you are agreeing to. */
function Gate({ onOk }) {
  return (
    <div>
      <div style={{ height: 88 }} />
      <Logo />
      <div style={{ marginTop: 34 }}>
        <button className="lb-btn" onClick={onOk}>
          Everyone here is 18+ and up for it
        </button>
      </div>
    </div>
  );
}

function NameAsk({ title, blurb, needCode, initialCode, cta, busy, err, onGo, onBack }) {
  const [name, setName] = useState(() => LS.get("lb:name", ""));
  const [code, setCode] = useState(initialCode || "");
  const ok = name.trim().length > 0 && (!needCode || code.trim().length === 4);

  function go() {
    if (!ok || busy) return;
    LS.set("lb:name", name.trim().slice(0, 14));
    onGo(name.trim().slice(0, 14), code.trim().toUpperCase());
  }

  return (
    <div>
      <div style={{ height: 16 }} />
      <Logo small />
      <div className="lb-card">
        <h3>{title}</h3>
        <hr className="lb-hair" />
        <p className="lb-note" style={{ marginBottom: 14 }}>{blurb}</p>

        {needCode && (
          <>
            <div className="lb-label">Room code</div>
            <input className="lb-input lb-code-in" value={code} maxLength={4}
              autoCapitalize="characters" autoCorrect="off" spellCheck="false"
              placeholder="&middot;&middot;&middot;&middot;"
              onChange={(e) => setCode(e.target.value.toUpperCase().replace(/[^A-Z]/g, ""))} />
            <div style={{ height: 14 }} />
          </>
        )}

        <div className="lb-label">Your name</div>
        <input className="lb-input" value={name} maxLength={14} placeholder="What do they call you?"
          onChange={(e) => setName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && go()} />

        {err && <div className="lb-warn" style={{ marginTop: 14 }}>{err}</div>}
      </div>

      <div style={{ marginTop: 16 }}>
        <button className="lb-btn violet" onClick={go} disabled={!ok || busy}>
          {busy ? "One sec…" : cta}
        </button>
      </div>
      <div style={{ marginTop: 10 }}>
        <button className="lb-btn ghost" onClick={onBack}>Back</button>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  APP                                                                *
 * ================================================================== */

function freshState(hostId) {
  return {
    v: 1, phase: "lobby",
    players: [], pairs: [],
    cfg: { len: 40, maxHeat: 5 },
    order: [], casts: [], i: 0, skips: [],
    host: hostId || null, ts: Date.now()
  };
}

function App() {
  const [gate, setGate]     = useState(() => LS.get("lb:gate", false));
  const [route, setRoute]   = useState("home");     /* home | create | join */
  const [code, setCode]     = useState(null);       /* null => single phone  */
  const [meId, setMeId]     = useState(null);
  const [st, setStRaw]      = useState(null);
  const [presence, setPres] = useState({});
  const [busy, setBusy]     = useState(false);
  const [err, setErr]       = useState(null);
  const [hashCode, setHash] = useState("");

  const online = LBSync.available();
  const solo   = !code;
  const stRef  = useRef(null);
  stRef.current = st;

  /* A shared link lands on #ABCD, so jump straight to the join screen. The
     hashchange listener matters as much as the mount check: if Labello is
     already open in that browser tab, tapping the link only changes the hash
     and never reloads, so without this nothing would happen. */
  useEffect(() => {
    const readHash = () => {
      const h = (location.hash || "").replace("#", "").toUpperCase().replace(/[^A-Z]/g, "");
      if (h.length !== 4 || h === code) return;
      setHash(h);
      if (online) setRoute("join");
    };
    readHash();
    window.addEventListener("hashchange", readHash);
    return () => window.removeEventListener("hashchange", readHash);
  }, [online, code]);

  /* Live room state + who is currently connected. */
  useEffect(() => {
    if (!code) return;
    const offState = LBSync.subscribe(code, (s) => { if (s) setStRaw(s); });
    const offPres  = LBSync.watchPresence(code, setPres);
    return () => { offState(); offPres(); };
  }, [code]);

  useEffect(() => {
    if (!code || !meId) return;
    const me = (stRef.current && stRef.current.players.filter((p) => p.id === meId)[0]) || null;
    return LBSync.presence(code, meId, me ? me.name : "?");
  }, [code, meId]);

  const commit = useCallback((next) => {
    next.ts = Date.now();
    setStRaw(next);
    if (code) LBSync.write(code, next);
  }, [code]);

  /* ---- room lifecycle ---- */
  function createRoom(name) {
    setBusy(true); setErr(null);
    const rc = newCode(), id = newId();
    const s = freshState(id);
    s.players = [{ id: id, name: name, c: 0 }];
    LBSync.create(rc, s).then((ok) => {
      setBusy(false);
      if (!ok) { setErr("Could not reach the database. Check the Firebase setup in the README."); return; }
      LS.set("lb:seat:" + rc, { id: id, name: name });
      setMeId(id); setCode(rc); setStRaw(s); setRoute("home");
    });
  }

  function joinRoom(name, rc) {
    setBusy(true); setErr(null);
    const seat = LS.get("lb:seat:" + rc, null);
    const id = (seat && seat.id) || newId();
    LBSync.join(rc, { id: id, name: name, c: 0 }).then((res) => {
      setBusy(false);
      if (!res.room) { setErr("No room with the code " + rc + "."); return; }
      if (!res.ok) {
        /* The join transaction aborts once a game is running, but rejoining
           your own seat after a refresh has to keep working. */
        const mine = res.room.players.filter((p) => p.id === id)[0];
        if (mine) {
          LS.set("lb:seat:" + rc, { id: id, name: mine.name });
          setMeId(id); setCode(rc); setStRaw(res.room); setRoute("home");
          return;
        }
        setErr(res.room.phase !== "lobby"
          ? "That game has already started without you."
          : "That room is full.");
        return;
      }
      LS.set("lb:seat:" + rc, { id: id, name: name });
      setMeId(id); setCode(rc); setStRaw(res.room); setRoute("home");
    });
  }

  function leave() {
    setCode(null); setMeId(null); setStRaw(null); setPres({});
    setRoute("home"); setErr(null);
    if (location.hash) history.replaceState(null, "", location.pathname);
  }

  /* ---- gameplay ---- */
  function start() {
    const s = stRef.current;
    const g = buildGame(s.players, s.pairs, s.cfg.len, s.cfg.maxHeat);
    if (!g.order.length) { setErr("Could not deal a game from that setup."); return; }
    commit({ ...s, phase: "play", order: g.order, casts: g.casts, i: 0, skips: [] });
  }

  function advance(pass) {
    const s = stRef.current;
    if (!s || s.phase !== "play") return;
    const seen = s.i;
    const apply = (x) => {
      const ni = x.i + 1;
      return {
        ...x,
        i: ni,
        skips: pass ? (x.skips || []).concat([x.i]) : (x.skips || []),
        phase: ni >= x.order.length ? "end" : "play",
        ts: Date.now()
      };
    };
    if (code) {
      /* Compare-and-swap on the index we actually looked at, so four people
         tapping the same card only moves the game on once. */
      LBSync.tx(code, (cur) => {
        if (!cur || cur.phase !== "play" || cur.i !== seen) return undefined;
        return apply(cur);
      });
    } else {
      setStRaw(apply(s));
    }
  }

  /* Step back one card. Active rules are derived from the position rather than
     stored, so they recompute on their own. A card you had passed stops
     counting as passed once you return to it. */
  function back() {
    const s = stRef.current;
    if (!s || s.phase !== "play" || s.i <= 0) return;
    const seen = s.i;
    const apply = (x) => ({
      ...x,
      i: x.i - 1,
      skips: (x.skips || []).filter((k) => k !== x.i - 1),
      ts: Date.now()
    });
    if (code) {
      LBSync.tx(code, (cur) => {
        if (!cur || cur.phase !== "play" || cur.i !== seen || cur.i <= 0) return undefined;
        return apply(cur);
      });
    } else {
      setStRaw(apply(s));
    }
  }

  function quit() {
    const s = stRef.current;
    const host = solo || (s && s.host === meId);
    if (!host) { leave(); return; }
    if (!confirm("End the game and go back to the lobby?")) return;
    commit({ ...s, phase: "lobby", order: [], casts: [], i: 0, skips: [] });
  }

  /* ---- render ---- */
  const S = <style>{CSS}</style>;
  const shell = (kids) => <div className="lb">{S}<div className="lb-wrap">{kids}</div></div>;

  if (!gate) return shell(
    <Gate onOk={() => { LS.set("lb:gate", true); setGate(true); }} />
  );

  if (route === "create") return shell(
    <NameAsk title="Host a room" cta="Create the room" busy={busy} err={err}
      blurb="You will get a four letter code. Everyone else joins with it, and you decide the matches."
      onGo={(n) => createRoom(n)} onBack={() => { setRoute("home"); setErr(null); }} />
  );

  if (route === "join") return shell(
    <NameAsk title="Join a room" cta="Join" needCode initialCode={hashCode} busy={busy} err={err}
      blurb="Ask the host for the code, or scan the QR on their screen."
      onGo={(n, c) => joinRoom(n, c)} onBack={() => { setRoute("home"); setErr(null); }} />
  );

  if (!st) return shell(
    <Home online={online}
      onSolo={() => setStRaw(freshState(null))}
      onCreate={() => setRoute("create")}
      onJoin={() => setRoute("join")} />
  );

  const isHost = solo || st.host === meId;

  if (st.phase === "lobby") return shell(
    <>
      <Lobby st={st} setSt={commit} solo={solo} code={code} meId={meId}
        isHost={isHost} presence={presence} onStart={start} onLeave={leave} />
      {err && <div className="lb-warn" style={{ marginTop: 14 }}>{err}</div>}
    </>
  );

  if (st.phase === "play") return shell(
    <Play st={st} meId={meId} onBack={back}
      onNext={() => advance(false)} onPass={() => advance(true)} onQuit={quit} />
  );

  return shell(
    <End st={st} canRestart={isHost}
      onAgain={() => commit({ ...st, phase: "lobby", order: [], casts: [], i: 0, skips: [] })}
      onHome={leave} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
